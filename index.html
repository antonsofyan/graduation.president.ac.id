<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Under Construction | President University</title>
    <meta name="description" content="President University Graduation — website under construction" />
    <link href="assets/favicon.png" rel="icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .logo img {
            max-width: 220px;
            height: auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            margin: 2rem 0 0.75rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.7;
            color: #666666;
            max-width: 480px;
        }

        .contact {
            margin-top: 2rem;
        }

        .contact a {
            color: #b5121b;
            text-decoration: none;
            font-weight: 500;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        footer {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.8rem;
            color: #999999;
        }
    </style>
</head>

<body>
    <div class="logo">
        <img src="assets/logo.png" alt="President University">
    </div>
    <h1>Website Under Construction</h1>
    <p>We're working hard to prepare the President University Graduation website. Please check back soon for the latest
        information.</p>
    <p class="contact">For inquiries: <a href="mailto:graduation@president.ac.id">graduation@president.ac.id</a></p>
    <footer>&copy; <span id="year"></span> President University</footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
